name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: app
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Jarvis.apk --title "Jarvis (latest APK)" --notes "Android APK. Download Jarvis.apk and install." --target "${{ github.sha }}"
